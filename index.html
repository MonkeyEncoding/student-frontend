<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Records</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>
  try {
    var t = localStorage.getItem('theme');
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>
<style>
  :root { color-scheme: light; --bg:#eff3f1; --panel:#fff; --ink:#13201c; --muted:#5b6b66; --line:#d5dfdb; --accent:#0b7a5e; --on:#fff; --tint:#def2eb; --danger:#c2371f; --tagL:90%; --tagS:60%; --tagT:#1d2b27; }
  [data-theme=dark] { color-scheme: dark; --bg:#0e1614; --panel:#16211e; --ink:#e6efec; --muted:#93a7a0; --line:#26352f; --accent:#35c79b; --on:#07241b; --tint:#1c3a30; --danger:#ff8068; --tagL:24%; --tagS:35%; --tagT:#e6efec; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Hanken Grotesk',system-ui,sans-serif; line-height:1.5; }
  .wrap { max-width:1120px; margin:0 auto; padding:28px 20px 120px; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  button { font:inherit; font-weight:600; cursor:pointer; padding:8px 14px; border-radius:9px; border:1px solid var(--line); background:var(--panel); color:var(--ink); }
  button:hover { background:var(--tint); }
  button:disabled { opacity:.55; cursor:wait; }
  .primary { background:var(--accent); border-color:var(--accent); color:var(--on); }
  .primary:hover { background:var(--accent); filter:brightness(1.1); }
  .ghost { border-color:transparent; background:transparent; }
  .danger { color:var(--danger); }
  kbd { font:600 .75rem 'Hanken Grotesk',sans-serif; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:0 5px; color:var(--muted); background:var(--panel); }

  .top { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:22px; }
  h1 { font-family:'Fraunces',serif; font-size:clamp(2rem,5vw,3.1rem); line-height:1; letter-spacing:-.02em; margin:0 0 8px; }
  .stats { color:var(--muted); display:flex; gap:18px; flex-wrap:wrap; font-size:.92rem; }
  .stats b { color:var(--ink); font-size:1.05rem; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }

  .bar { position:sticky; top:0; z-index:4; display:flex; gap:10px; flex-wrap:wrap; align-items:center; padding:10px 0; background:var(--bg); }
  .search { flex:1 1 240px; position:relative; }
  .search input { width:100%; font:inherit; color:inherit; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 40px 10px 14px; }
  .search kbd { position:absolute; right:10px; top:50%; transform:translateY(-50%); }
  select { font:inherit; color:inherit; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:9px 10px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .seg button { border:0; border-radius:0; background:var(--panel); }
  .seg button[aria-pressed=true] { background:var(--accent); color:var(--on); }
  .selrow { display:flex; align-items:center; justify-content:space-between; margin:6px 0 12px; color:var(--muted); font-size:.9rem; }
  .selrow label { display:flex; align-items:center; gap:8px; font-weight:600; color:var(--ink); cursor:pointer; }
  input[type=checkbox] { width:19px; height:19px; accent-color:var(--accent); margin:0; cursor:pointer; }
  .chip.on { outline:2px solid var(--accent); }
  .filterbar { display:none; margin-bottom:10px; gap:8px; align-items:center; }
  .filterbar.show { display:flex; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
  .grid.compact { grid-template-columns:1fr; gap:6px; }
  .card { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; align-content:start; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .card.selected { background:var(--tint); border-color:var(--accent); }
  .card h3 { font-family:'Fraunces',serif; font-size:1.1rem; line-height:1.25; margin:0; overflow-wrap:anywhere; }
  .card p { margin:6px 0 0; white-space:pre-wrap; overflow-wrap:anywhere; }
  .card .main { min-width:0; }
  .foot { grid-column:1 / -1; display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:8px; padding-top:8px; border-top:1px solid var(--line); color:var(--muted); font-size:.8rem; }
  .foot button { padding:4px 10px; font-size:.85rem; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip { border:0; padding:2px 9px; border-radius:999px; font-size:.78rem; font-weight:600; color:var(--tagT); background:hsl(var(--h) var(--tagS) var(--tagL)); }
  .chip:hover { filter:brightness(.95); background:hsl(var(--h) var(--tagS) var(--tagL)); }
  mark { background:hsl(48 95% 62% / .55); color:inherit; border-radius:3px; padding:0 1px; }
  .compact .card { grid-template-columns:auto 1fr auto; align-items:center; padding:9px 14px; }
  .compact .card p { margin:0; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
  .compact .foot { grid-column:auto; margin:0; padding:0; border:0; }
  .compact .tags { margin-top:4px; }
  @media (max-width:640px) { .compact .card { grid-template-columns:auto 1fr; } .compact .foot { grid-column:1 / -1; } }

  .lbl { display:block; font-weight:600; font-size:.88rem; margin-bottom:5px; }
  .status { display:inline-block; font-size:.72rem; font-weight:700; padding:1px 9px; border-radius:999px; margin-left:8px; vertical-align:middle; }
  .s-present { background:#d9f2e4; color:#12633a; }
  .s-absent { background:#fbdcd6; color:#9a2a16; }
  .s-late { background:#fcecc4; color:#7a5200; }
  [data-theme=dark] .s-present { background:#1b4a35; color:#9ce8c2; }
  [data-theme=dark] .s-absent { background:#512621; color:#ffb4a6; }
  [data-theme=dark] .s-late { background:#4d3a10; color:#ffd77a; }
  .pick { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; position:relative; }
  dialog .pick input { position:absolute; opacity:0; pointer-events:none; width:1px; height:1px; padding:0; margin:0; }
  dialog .pick label { margin:0; text-align:center; padding:10px 6px; border:2px solid var(--line); border-radius:10px; cursor:pointer; font-weight:700; background:var(--bg); }
  dialog .pick input:focus-visible + label { outline:3px solid var(--accent); outline-offset:2px; }
  .pick input:checked + .pk-present { background:#d9f2e4; color:#12633a; border-color:#12633a; }
  .pick input:checked + .pk-absent { background:#fbdcd6; color:#9a2a16; border-color:#9a2a16; }
  .pick input:checked + .pk-late { background:#fcecc4; color:#7a5200; border-color:#7a5200; }
  [data-theme=dark] .pick input:checked + .pk-present { background:#1b4a35; color:#9ce8c2; border-color:#9ce8c2; }
  [data-theme=dark] .pick input:checked + .pk-absent { background:#512621; color:#ffb4a6; border-color:#ffb4a6; }
  [data-theme=dark] .pick input:checked + .pk-late { background:#4d3a10; color:#ffd77a; border-color:#ffd77a; }
  .skel { height:150px; border-radius:12px; background:linear-gradient(100deg,var(--panel) 30%,var(--tint) 50%,var(--panel) 70%); background-size:300% 100%; animation:sh 1.4s infinite; border:1px solid var(--line); }
  @keyframes sh { from { background-position:100% 0; } to { background-position:0 0; } }
  .state { text-align:center; padding:48px 16px; border:1px dashed var(--line); border-radius:12px; color:var(--muted); }
  .state p { margin:0 0 14px; }
  .more { display:block; margin:18px auto 0; }

  #bulk { position:fixed; left:50%; bottom:22px; transform:translate(-50%,100px); opacity:0; pointer-events:none; display:flex; gap:10px; align-items:center; background:var(--ink); color:var(--bg); padding:10px 12px 10px 18px; border-radius:14px; box-shadow:0 12px 32px rgba(0,0,0,.28); transition:.2s; z-index:6; max-width:calc(100vw - 20px); }
  #bulk.show { transform:translate(-50%,0); opacity:1; pointer-events:auto; }
  #bulk button { background:transparent; color:inherit; border-color:rgba(128,128,128,.5); }
  #bulk .del { background:var(--danger); border-color:var(--danger); color:#fff; }
  #toast { position:fixed; top:16px; left:50%; transform:translate(-50%,-30px); opacity:0; pointer-events:none; display:flex; gap:12px; align-items:center; background:var(--ink); color:var(--bg); padding:9px 14px 9px 18px; border-radius:12px; transition:.2s; z-index:8; }
  #toast.show { transform:translate(-50%,0); opacity:1; pointer-events:auto; }
  #toast.error { background:var(--danger); color:#fff; }
  #toast button { padding:3px 10px; background:transparent; color:inherit; border-color:rgba(128,128,128,.6); }

  dialog { border:1px solid var(--line); border-radius:16px; background:var(--panel); color:var(--ink); padding:22px; width:min(520px,calc(100% - 28px)); }
  dialog::backdrop { background:rgba(6,12,10,.6); }
  dialog h2 { font-family:'Fraunces',serif; margin:0 0 14px; }
  dialog label { display:block; font-weight:600; font-size:.88rem; margin-bottom:5px; }
  dialog input, dialog textarea { width:100%; font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:10px 12px; margin-bottom:12px; }
  dialog textarea { min-height:150px; resize:vertical; }
  .hint { color:var(--muted); font-size:.8rem; display:flex; justify-content:space-between; margin:-6px 0 14px; gap:10px; }
  .row { display:flex; gap:8px; justify-content:flex-end; align-items:center; }
  @media (prefers-reduced-motion:reduce) { .skel { animation:none; } #bulk, #toast { transition:none; } }

  /* ===== School theme ===== */
  :root { --bg:#f3f7fa; --panel:#fff; --paper:#fdfdfb; --ink:#1f2a44; --muted:#5c6785; --line:#cdd7e6; --accent:#2b50aa; --on:#fff; --tint:#e3ebfb; --danger:#c8372d; --rule:#d6e4f5; --mline:#e5645d; --board:#244a3b; --frame:#a8743d; --chalk:#f4f1e6; --pencil:#f6c945; --hl:#fff1a8; }
  [data-theme=dark] { --bg:#14211c; --panel:#1d2f27; --paper:#223a30; --ink:#eef3e8; --muted:#a3b8ab; --line:#33503f; --accent:#9db8ff; --on:#0c1a3a; --tint:#2b4a3c; --danger:#ff8a78; --rule:#2d4b3e; --mline:#b3605a; --board:#1a3a2d; --frame:#6f4d29; --hl:#4d4a1d; }
  body { font-family:'Nunito',system-ui,sans-serif; background-color:var(--bg); background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px); background-size:28px 28px; }
  h1, .card h3, dialog h2, .stats b, .state { font-family:'Patrick Hand','Nunito',sans-serif; font-weight:400; }
  kbd { font-family:'Nunito',sans-serif; }

  .top { align-items:center; background-color:var(--board); color:var(--chalk); border:10px solid var(--frame); border-radius:10px; padding:18px 24px; box-shadow:inset 0 0 40px rgba(0,0,0,.35), 0 5px 0 rgba(0,0,0,.15);
    background-image:radial-gradient(ellipse at 15% 0%,rgba(255,255,255,.08),transparent 60%),radial-gradient(ellipse at 95% 100%,rgba(255,255,255,.06),transparent 50%); }
  h1 { color:var(--chalk); font-size:clamp(2.3rem,6vw,3.5rem); letter-spacing:.01em; margin:0; text-shadow:0 0 1px rgba(255,255,255,.6); }
  .date { margin:2px 0 10px; color:rgba(244,241,230,.75); }
  .stats { color:rgba(244,241,230,.85); }
  .stats b { color:#ffe27a; font-size:1.6rem; }
  .top button { background:transparent; color:var(--chalk); border:2px dashed rgba(244,241,230,.55); }
  .top button:hover { background:rgba(255,255,255,.1); }
  .top .primary { background:var(--pencil); color:#3a2b00; border:2px solid #d9a91d; }
  .top .primary kbd { background:rgba(255,255,255,.5); color:#3a2b00; border-color:#d9a91d; }

  button { border-width:2px; border-radius:10px; }
  .primary { background:var(--pencil); border-color:#d9a91d; color:#3a2b00; box-shadow:0 3px 0 #c79a14; }
  .primary:hover { background:var(--pencil); filter:brightness(1.05); }
  .primary:active { transform:translateY(2px); box-shadow:0 1px 0 #c79a14; }
  .bar { background:color-mix(in srgb,var(--bg) 88%,transparent); backdrop-filter:blur(6px); }
  .search input, select { border-width:2px; background:var(--panel); }
  .seg { border-width:2px; }

  .card { --cardbg:var(--paper); --margin:linear-gradient(90deg,transparent 43px,var(--mline) 43px,var(--mline) 45px,transparent 45px); --ruled:linear-gradient(transparent 25px,var(--rule) 25px);
    background-color:var(--cardbg); background-image:var(--margin),var(--ruled); background-size:100% 100%,100% 26px; background-repeat:no-repeat,repeat-y; background-position:0 0,0 12px;
    border-radius:6px 12px 12px 6px; padding:12px 14px 10px; box-shadow:0 2px 0 rgba(31,42,68,.08),0 6px 14px rgba(31,42,68,.06); }
  .card.selected { --cardbg:var(--hl); border-color:#d9a91d; }
  .card h3 { font-size:1.4rem; line-height:26px; }
  .card p { line-height:26px; margin:0; }
  .foot { background:var(--cardbg); }
  .compact .card { background-image:var(--margin); background-size:100% 100%; background-position:0 0; padding:8px 14px; }
  .compact .card h3, .compact .card p { line-height:1.4; }
  .chip { border-radius:5px; transform:rotate(-1.5deg); }

  .status { border:2px solid currentColor; border-radius:6px; transform:rotate(-3deg); letter-spacing:.02em; }
  .s-present::before, .pk-present::before { content:'\2605  '; }
  .s-absent::before, .pk-absent::before { content:'\2717  '; }
  .s-late::before, .pk-late::before { content:'\23F0  '; }

  .state { border:2px dashed var(--line); background:var(--panel); font-size:1.3rem; }
  #bulk { background:var(--board); color:var(--chalk); border:4px solid var(--frame); border-radius:12px; }
  #toast { background:#fff1a8; color:#3b3200; border:1px solid #d9a91d; border-radius:4px; transform:translate(-50%,-30px) rotate(-1deg); box-shadow:0 8px 16px rgba(0,0,0,.25); }
  #toast.show { transform:translate(-50%,0) rotate(-1deg); }
  #toast.error { background:var(--danger); color:#fff; border-color:transparent; }
  dialog { border:3px solid var(--ink); border-radius:8px 16px 16px 8px; padding:22px 22px 22px 44px; background-color:var(--paper);
    background-image:linear-gradient(90deg,transparent 30px,var(--mline) 30px,var(--mline) 32px,transparent 32px); }
  dialog h2 { font-size:1.9rem; }
  dialog input:not([type=radio]), dialog textarea { border-width:2px; background:var(--panel); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Student Records</h1>
      <p class="date" id="today"></p>
      <div class="stats" aria-live="polite"><span><b id="sTotal">0</b> records</span><span><b id="sToday">0</b> added today</span><span><b id="sPresent">0</b> present</span><span><b id="sAbsent">0</b> absent</span><span><b id="sLate">0</b> late</span></div>
    </div>
    <div class="actions">
      <button id="themeBtn" class="ghost" aria-label="Switch theme">Dark mode</button>
      <button id="exportBtn">Export CSV</button>
      <button id="newBtn" class="primary">New record <kbd>N</kbd></button>
    </div>
  </div>

  <div class="bar">
    <div class="search"><input type="search" id="search" placeholder="Search titles, text or #tags" aria-label="Search records"><kbd>/</kbd></div>
    <select id="sort" aria-label="Sort records"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="az">Title A to Z</option></select>
    <select id="statusFilter" aria-label="Filter by attendance"><option value="">All statuses</option><option value="present">Present</option><option value="absent">Absent</option><option value="late">Late</option></select>
    <div class="seg" role="group" aria-label="View"><button id="vCards" aria-pressed="true">Cards</button><button id="vList" aria-pressed="false">Compact</button></div>
  </div>

  <div class="filterbar" id="tagbar"></div>
  <div class="selrow"><label><input type="checkbox" id="selAll"> Select all</label><span id="count"></span></div>
  <div id="list" class="grid"></div>
</div>

<div id="bulk" role="region" aria-label="Bulk actions"><strong id="selCount" aria-live="polite"></strong><button id="clearSel">Clear</button><button id="delSel" class="del">Delete selected</button></div>
<div id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastAct" hidden>Undo</button></div>

<dialog id="editor">
  <form id="form">
    <h2 id="edTitle">New record</h2>
    <span class="lbl" id="stLabel">Attendance</span>
    <div class="pick" role="radiogroup" aria-labelledby="stLabel">
      <input type="radio" name="status" id="stP" value="present" checked><label for="stP" class="pk-present">Present</label>
      <input type="radio" name="status" id="stA" value="absent"><label for="stA" class="pk-absent">Absent</label>
      <input type="radio" name="status" id="stL" value="late"><label for="stL" class="pk-late">Late</label>
    </div>
    <label for="fTitle">Title</label>
    <input id="fTitle" maxlength="100" required>
    <label for="fContent">Content</label>
    <textarea id="fContent" maxlength="1000" required></textarea>
    <div class="hint"><span>Add #tags to organise records.</span><span><span id="chars">0</span> / 1000</span></div>
    <div class="row"><span class="hint" style="margin:0 auto 0 0"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> to save</span><button type="button" id="cancelBtn">Cancel</button><button type="submit" class="primary" id="saveBtn">Add record</button></div>
  </form>
</dialog>

<script>
  // Replace with your Vercel API URL if it ever changes
  const API = 'https://student-api-backend-eight.vercel.app/api';
  const TAG = /(^|\s)#([\p{L}\d_-]{2,20})/gu;
  const $ = id => document.getElementById(id);
  const STATUS = { present: 'Present', absent: 'Absent', late: 'Late' };
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  let records = [], selected = new Set(), pending = new Set(), batches = new Set();
  let editing = null, lastIdx = null, limit = 12, view = store.get('view') || 'cards';

  const tagsOf = r => [...r.content.matchAll(TAG)].map(m => m[2].toLowerCase());
  const bodyOf = r => r.content.replace(TAG, '$1').replace(/[ \t]+\n/g, '\n').trim();
  const hue = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);

  function el(tag, props, kids) {
    const n = document.createElement(tag);
    Object.assign(n, props || {});
    (kids || []).forEach(k => n.appendChild(k));
    return n;
  }
  function highlight(text, q) {
    const f = document.createDocumentFragment();
    if (!q) { f.append(text); return f; }
    const low = text.toLowerCase(); let i = 0, j;
    while ((j = low.indexOf(q, i)) !== -1) {
      f.append(text.slice(i, j), el('mark', { textContent: text.slice(j, j + q.length) }));
      i = j + q.length;
    }
    f.append(text.slice(i));
    return f;
  }
  function ago(d) {
    const s = (Date.now() - new Date(d)) / 1000;
    if (s < 60) return 'just now';
    for (const [n, u] of [[60, 'min'], [3600, 'hour'], [86400, 'day']]) {
      const next = n === 60 ? 3600 : n === 3600 ? 86400 : 2592000;
      if (s < next) { const v = Math.floor(s / n); return v + ' ' + u + (v > 1 ? 's' : '') + ' ago'; }
    }
    return new Date(d).toLocaleDateString();
  }

  /* ---------- toast ---------- */
  let toastTimer, toastAction;
  function toast(msg, opts) {
    opts = opts || {};
    const t = $('toast');
    $('toastMsg').textContent = msg;
    $('toastAct').hidden = !opts.undo;
    toastAction = opts.undo;
    t.className = 'show' + (opts.error ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = ''; }, opts.undo ? 5200 : 2600);
  }
  $('toastAct').onclick = () => { if (toastAction) toastAction(); $('toast').className = ''; };

  /* ---------- api ---------- */
  async function request(url, options) {
    const res = await fetch(url, options);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Something went wrong');
    return data;
  }
  async function load() {
    $('list').className = 'grid';
    $('list').replaceChildren(...Array.from({ length: 6 }, () => el('div', { className: 'skel' })));
    const wake = setTimeout(() => toast('Waking up the server, one moment...'), 3500);
    try {
      records = await request(API);
      selected = new Set([...selected].filter(id => records.some(r => r._id === id)));
      render();
    } catch (e) {
      const retry = el('button', { textContent: 'Try again' });
      retry.onclick = load;
      $('list').className = '';
      $('list').replaceChildren(el('div', { className: 'state' }, [el('p', { textContent: 'Could not load records. Check your connection and try again.' }), retry]));
    }
    clearTimeout(wake);
  }

  /* ---------- filtering ---------- */
  function visible() {
    const q = $('search').value.trim().toLowerCase();
    const sf = $('statusFilter').value;
    const out = records.filter(r => !pending.has(r._id) && (!sf || r.status === sf) && (!q || r.title.toLowerCase().includes(q) || r.content.toLowerCase().includes(q)));
    const s = $('sort').value;
    return out.sort((a, b) => s === 'az' ? a.title.localeCompare(b.title) : s === 'old' ? new Date(a.createdAt) - new Date(b.createdAt) : new Date(b.createdAt) - new Date(a.createdAt));
  }

  /* ---------- render ---------- */
  function render() {
    const q = $('search').value.trim().toLowerCase();
    const live = records.filter(r => !pending.has(r._id));
    const all = visible(), shown = all.slice(0, limit);
    const today = new Date().toDateString();
    const tagCount = {};
    live.forEach(r => tagsOf(r).forEach(t => tagCount[t] = (tagCount[t] || 0) + 1));
    $('sTotal').textContent = live.length;
    $('sToday').textContent = live.filter(r => new Date(r.createdAt).toDateString() === today).length;
    ['present', 'absent', 'late'].forEach(k => { $('s' + k[0].toUpperCase() + k.slice(1)).textContent = live.filter(r => r.status === k).length; });
    $('count').textContent = all.length + ' of ' + live.length + ' shown';

    const bar = $('tagbar');
    const top = Object.entries(tagCount).sort((a, b) => b[1] - a[1]).slice(0, 12);
    bar.className = 'filterbar' + (top.length ? ' show' : '');
    bar.replaceChildren(...top.map(([t, n]) => {
      const c = el('button', { className: 'chip' + (q === '#' + t ? ' on' : ''), textContent: '#' + t + ' ' + n });
      c.style.setProperty('--h', hue(t));
      c.onclick = () => { $('search').value = q === '#' + t ? '' : '#' + t; limit = 12; render(); };
      return c;
    }));

    const list = $('list');
    list.className = view === 'list' ? 'grid compact' : 'grid';
    $('vCards').setAttribute('aria-pressed', view !== 'list');
    $('vList').setAttribute('aria-pressed', view === 'list');
    list.replaceChildren();
    if (!shown.length) {
      list.className = '';
      const msg = live.length ? 'No records match your search.' : 'The roll is empty. Add your first record.';
      const kids = [el('p', { textContent: msg })];
      if (!live.length) { const b = el('button', { className: 'primary', textContent: 'New record' }); b.onclick = () => openEditor(); kids.push(b); }
      list.appendChild(el('div', { className: 'state' }, kids));
    } else {
      shown.forEach((r, i) => list.appendChild(card(r, i, shown, q)));
    }
    document.querySelectorAll('.more').forEach(n => n.remove());
    if (all.length > shown.length) {
      const more = el('button', { className: 'more', textContent: 'Show ' + Math.min(12, all.length - shown.length) + ' more' });
      more.onclick = () => { limit += 12; render(); };
      list.after(more);
    }

    const n = all.filter(r => selected.has(r._id)).length;
    $('selAll').checked = all.length > 0 && n === all.length;
    $('selAll').indeterminate = n > 0 && n < all.length;
    $('selAll').disabled = !all.length;
    $('selCount').textContent = selected.size + ' selected';
    $('bulk').className = selected.size ? 'show' : '';
  }

  function card(r, i, shown, q) {
    const box = el('input', { type: 'checkbox', checked: selected.has(r._id), ariaLabel: 'Select ' + r.title });
    box.onclick = e => {
      const ids = (e.shiftKey && lastIdx !== null) ? shown.slice(Math.min(lastIdx, i), Math.max(lastIdx, i) + 1).map(x => x._id) : [r._id];
      ids.forEach(id => box.checked ? selected.add(id) : selected.delete(id));
      lastIdx = i; render();
    };
    const h3 = el('h3', {}, [highlight(r.title, q)]);
    if (STATUS[r.status]) h3.appendChild(el('span', { className: 'status s-' + r.status, textContent: STATUS[r.status] }));
    const main = el('div', { className: 'main' }, [h3]);
    const body = bodyOf(r);
    if (body) main.appendChild(el('p', {}, [highlight(body, q)]));
    const tags = [...new Set(tagsOf(r))];
    if (tags.length) main.appendChild(el('div', { className: 'tags' }, tags.map(t => {
      const c = el('button', { className: 'chip', textContent: '#' + t });
      c.style.setProperty('--h', hue(t));
      c.onclick = () => { $('search').value = '#' + t; limit = 12; render(); };
      return c;
    })));
    const edited = r.updatedAt !== r.createdAt ? ' (edited)' : '';
    const time = el('time', { textContent: ago(r.createdAt) + edited, title: new Date(r.createdAt).toLocaleString() });
    const edit = el('button', { textContent: 'Edit', className: 'ghost' }); edit.onclick = () => openEditor(r);
    const del = el('button', { textContent: 'Delete', className: 'ghost danger' }); del.onclick = () => remove([r._id]);
    return el('article', { className: 'card' + (selected.has(r._id) ? ' selected' : '') }, [box, main, el('div', { className: 'foot' }, [time, el('span', {}, [edit, del])])]);
  }

  /* ---------- delete with undo ---------- */
  function remove(ids) {
    ids.forEach(id => { pending.add(id); selected.delete(id); });
    const batch = { ids, done: false };
    batch.timer = setTimeout(() => commit(batch), 5000);
    batches.add(batch);
    render();
    toast(ids.length + (ids.length === 1 ? ' record' : ' records') + ' deleted', { undo: () => {
      clearTimeout(batch.timer); batches.delete(batch);
      ids.forEach(id => pending.delete(id)); render();
    } });
  }
  async function commit(batch) {
    batch.done = true; batches.delete(batch);
    const res = await Promise.allSettled(batch.ids.map(id => request(API + '?id=' + id, { method: 'DELETE' })));
    const failed = batch.ids.filter((id, i) => res[i].status === 'rejected');
    batch.ids.forEach(id => pending.delete(id));
    records = records.filter(r => !batch.ids.includes(r._id) || failed.includes(r._id));
    render();
    if (failed.length) toast(failed.length + ' could not be deleted. They are back in the list.', { error: true });
  }
  addEventListener('pagehide', () => batches.forEach(b => !b.done && b.ids.forEach(id => fetch(API + '?id=' + id, { method: 'DELETE', keepalive: true }).catch(() => {}))));

  /* ---------- editor ---------- */
  function openEditor(r) {
    editing = r || null;
    $('edTitle').textContent = r ? 'Edit record' : 'New record';
    $('saveBtn').textContent = r ? 'Save changes' : 'Add record';
    let d = { title: '', content: '' };
    if (r) d = r; else { try { d = JSON.parse(store.get('draft')) || d; } catch (e) {} }
    $('fTitle').value = d.title; $('fContent').value = d.content;
    (document.querySelector('input[name=status][value="' + (d.status || 'present') + '"]') || $('stP')).checked = true;
    $('chars').textContent = d.content.length;
    $('editor').showModal();
    $('fTitle').focus();
  }
  function saveDraft() { if (!editing) store.set('draft', JSON.stringify({ title: $('fTitle').value, content: $('fContent').value, status: document.querySelector('input[name=status]:checked').value })); }
  $('fTitle').oninput = saveDraft;
  document.querySelectorAll('input[name=status]').forEach(i => { i.onchange = saveDraft; });
  $('fContent').oninput = e => { $('chars').textContent = e.target.value.length; saveDraft(); };
  $('cancelBtn').onclick = () => $('editor').close();
  $('form').onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('form').requestSubmit(); } };
  $('form').onsubmit = async e => {
    e.preventDefault();
    const btn = $('saveBtn'), label = btn.textContent;
    btn.disabled = true; btn.textContent = 'Saving...';
    try {
      const body = JSON.stringify({ title: $('fTitle').value, content: $('fContent').value, status: document.querySelector('input[name=status]:checked').value });
      const opts = { method: editing ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body };
      await request(editing ? API + '?id=' + editing._id : API, opts);
      if (!editing) store.del('draft');
      $('editor').close();
      toast(editing ? 'Changes saved' : 'Record added');
      await load();
    } catch (err) { toast(err.message, { error: true }); }
    btn.disabled = false; btn.textContent = label;
  };

  /* ---------- export ---------- */
  $('exportBtn').onclick = () => {
    const rows = selected.size ? records.filter(r => selected.has(r._id)) : visible();
    const cell = v => { v = String(v); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
    const csv = ['Title,Status,Content,Created,Updated'].concat(rows.map(r => [r.title, r.status || '', r.content, r.createdAt, r.updatedAt].map(cell).join(','))).join('\r\n');
    const a = el('a', { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv' })), download: 'student-records.csv' });
    a.click(); URL.revokeObjectURL(a.href);
    toast('Exported ' + rows.length + (rows.length === 1 ? ' record' : ' records'));
  };

  /* ---------- wiring ---------- */
  $('newBtn').onclick = () => openEditor();
  $('search').oninput = () => { limit = 12; render(); };
  $('sort').onchange = render;
  $('statusFilter').onchange = () => { limit = 12; render(); };
  $('vCards').onclick = () => { view = 'cards'; store.set('view', view); render(); };
  $('vList').onclick = () => { view = 'list'; store.set('view', view); render(); };
  $('selAll').onchange = e => { visible().forEach(r => e.target.checked ? selected.add(r._id) : selected.delete(r._id)); render(); };
  $('clearSel').onclick = () => { selected.clear(); render(); };
  $('delSel').onclick = () => remove([...selected]);
  function syncTheme() { $('themeBtn').textContent = document.documentElement.dataset.theme === 'dark' ? 'Light mode' : 'Dark mode'; }
  $('themeBtn').onclick = () => {
    const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = t; store.set('theme', t); syncTheme();
  };
  document.addEventListener('keydown', e => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (e.key === '/' && !typing && !$('editor').open) { e.preventDefault(); $('search').focus(); }
    else if (e.key.toLowerCase() === 'n' && !typing && !$('editor').open && !e.ctrlKey && !e.metaKey) { e.preventDefault(); openEditor(); }
    else if (e.key === 'Escape' && !$('editor').open) { if (document.activeElement === $('search') && $('search').value) { $('search').value = ''; render(); } else if (selected.size) { selected.clear(); render(); } }
  });
  syncTheme();
  $('today').textContent = 'Roll call for ' + new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  load();
</script>
</body>
</html>
