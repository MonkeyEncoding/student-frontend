<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Records</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f7; --panel: #ffffff; --ink: #1b2233; --muted: #646f85;
    --line: #d9dfeb; --accent: #2149d1; --accent-ink: #fff; --tint: #e7edff;
    --danger: #c0301f; --danger-tint: #fdeeec; --field: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12172a; --panel: #1b2236; --ink: #e8ecf6; --muted: #9aa5bf;
      --line: #2e3854; --accent: #6f8cff; --accent-ink: #0d1330; --tint: #25305a;
      --danger: #ff7a6b; --danger-tint: #3a2227; --field: #141a2d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Figtree', system-ui, sans-serif; line-height: 1.5; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 40px 20px 110px; }
  header { margin-bottom: 28px; }
  h1 { font-family: 'Bricolage Grotesque', 'Figtree', sans-serif; font-size: clamp(2rem, 5vw, 3rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; margin: 0 0 6px; }
  .sub { color: var(--muted); margin: 0; }

  .layout { display: grid; grid-template-columns: 320px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  aside.panel { position: sticky; top: 20px; }
  @media (max-width: 800px) { aside.panel { position: static; } }
  h2 { font-family: 'Bricolage Grotesque', 'Figtree', sans-serif; font-size: 1.2rem; margin: 0 0 14px; }

  label { display: block; font-weight: 600; font-size: .88rem; margin-bottom: 5px; }
  input[type=text], input[type=search], textarea, select {
    width: 100%; font: inherit; color: inherit; background: var(--field);
    border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; margin-bottom: 14px;
  }
  textarea { resize: vertical; min-height: 110px; }
  .hint { color: var(--muted); font-size: .8rem; margin: -8px 0 14px; text-align: right; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  button { font: inherit; font-weight: 600; cursor: pointer; padding: 9px 15px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  button:hover { background: var(--tint); }
  button:disabled { opacity: .55; cursor: wait; }
  .primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .primary:hover { filter: brightness(1.1); background: var(--accent); }
  .full { width: 100%; }
  .danger { color: var(--danger); }
  .danger:hover { background: var(--danger-tint); }
  .danger-solid { background: var(--danger); border-color: var(--danger); color: #fff; }
  .danger-solid:hover { background: var(--danger); filter: brightness(1.1); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .toolbar input[type=search] { flex: 1 1 180px; margin: 0; }
  .toolbar select { width: auto; margin: 0; }
  .selectall { display: flex; align-items: center; gap: 8px; font-weight: 600; margin: 0 0 12px; cursor: pointer; }
  .meta-line { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: .9rem; }
  input[type=checkbox] { width: 19px; height: 19px; accent-color: var(--accent); cursor: pointer; margin: 0; flex: none; }

  .card { display: flex; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 10px; }
  .card.selected { background: var(--tint); border-color: var(--accent); }
  .card .body { flex: 1; min-width: 0; }
  .card h3 { margin: 0; font-size: 1.05rem; overflow-wrap: anywhere; }
  .card .when { color: var(--muted); font-size: .8rem; margin: 2px 0 8px; }
  .card p { margin: 0 0 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .card.editing { display: block; border-color: var(--accent); }
  .card.editing textarea { min-height: 90px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 12px; border: 1px dashed var(--line); border-radius: 12px; }

  #bulkbar {
    position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 90px); opacity: 0; pointer-events: none;
    display: flex; gap: 12px; align-items: center; background: var(--ink); color: var(--bg);
    padding: 10px 12px 10px 18px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25);
    transition: transform .2s, opacity .2s; max-width: calc(100vw - 24px);
  }
  #bulkbar.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
  #bulkbar button { background: transparent; color: inherit; border-color: rgba(255,255,255,.35); }
  #bulkbar button:hover { background: rgba(255,255,255,.12); }
  #bulkbar .danger-solid { background: var(--danger); border-color: var(--danger); color: #fff; }

  #toast { position: fixed; top: 18px; left: 50%; transform: translate(-50%, -20px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 5; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.error { background: var(--danger); color: #fff; }

  dialog { border: 1px solid var(--line); border-radius: 14px; padding: 22px; background: var(--panel); color: var(--ink); max-width: 400px; width: calc(100% - 32px); }
  dialog::backdrop { background: rgba(10, 15, 30, .55); }
  dialog h2 { margin-bottom: 6px; }
  dialog p { margin: 0 0 18px; color: var(--muted); }
  dialog .row { justify-content: flex-end; }
  @media (prefers-reduced-motion: reduce) { #bulkbar, #toast { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Student Records</h1>
    <p class="sub">Create, edit and delete records stored in MongoDB.</p>
  </header>

  <div class="layout">
    <aside class="panel">
      <h2>New record</h2>
      <form id="dataForm">
        <label for="title">Title</label>
        <input type="text" id="title" maxlength="100" required>
        <label for="content">Content</label>
        <textarea id="content" maxlength="1000" required></textarea>
        <div class="hint"><span id="chars">0</span> / 1000</div>
        <button type="submit" class="primary full" id="addBtn">Add record</button>
      </form>
    </aside>

    <main>
      <div class="toolbar">
        <input type="search" id="search" placeholder="Search records" aria-label="Search records">
        <select id="sort" aria-label="Sort records">
          <option value="new">Newest first</option>
          <option value="old">Oldest first</option>
          <option value="az">Title A to Z</option>
        </select>
      </div>
      <div class="meta-line">
        <label class="selectall"><input type="checkbox" id="selectAll"> Select all</label>
        <span id="count"></span>
      </div>
      <div id="list"><div class="empty">Loading records...</div></div>
    </main>
  </div>
</div>

<div id="bulkbar" role="region" aria-label="Bulk actions">
  <strong id="selCount"></strong>
  <button id="clearSel">Clear</button>
  <button id="delSel" class="danger-solid">Delete selected</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<dialog id="confirm">
  <form method="dialog">
    <h2 id="dlgTitle"></h2>
    <p id="dlgText"></p>
    <div class="row">
      <button value="cancel">Cancel</button>
      <button value="ok" class="danger-solid" id="dlgOk">Delete</button>
    </div>
  </form>
</dialog>

<script>
  // Replace with your Vercel API URL if it ever changes
  const API = 'https://student-api-backend-eight.vercel.app/api';

  const $ = id => document.getElementById(id);
  let records = [], selected = new Set(), editingId = null;

  function toast(msg, isError) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'show' + (isError ? ' error' : '');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => { t.className = ''; }, 2600);
  }

  async function request(url, options) {
    const res = await fetch(url, options);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Something went wrong');
    return data;
  }

  function ask(title, text, okLabel) {
    return new Promise(resolve => {
      $('dlgTitle').textContent = title;
      $('dlgText').textContent = text;
      $('dlgOk').textContent = okLabel;
      const dlg = $('confirm');
      dlg.returnValue = '';
      dlg.onclose = () => resolve(dlg.returnValue === 'ok');
      dlg.showModal();
    });
  }

  function el(tag, props, kids) {
    const n = document.createElement(tag);
    Object.assign(n, props || {});
    (kids || []).forEach(k => n.appendChild(k));
    return n;
  }

  async function load() {
    try {
      records = await request(API);
      const ids = new Set(records.map(r => r._id));
      selected = new Set([...selected].filter(id => ids.has(id)));
      render();
    } catch (e) {
      $('list').replaceChildren(el('div', { className: 'empty', textContent: 'Could not load records. Check your connection, then refresh the page.' }));
    }
  }

  function visible() {
    const q = $('search').value.trim().toLowerCase();
    const out = records.filter(r => r.title.toLowerCase().includes(q) || r.content.toLowerCase().includes(q));
    const s = $('sort').value;
    out.sort((a, b) =>
      s === 'az' ? a.title.localeCompare(b.title) :
      s === 'old' ? new Date(a.createdAt) - new Date(b.createdAt) :
      new Date(b.createdAt) - new Date(a.createdAt));
    return out;
  }

  function render() {
    const shown = visible();
    $('count').textContent = shown.length + ' of ' + records.length + (records.length === 1 ? ' record' : ' records');

    const list = $('list');
    list.replaceChildren();
    if (shown.length === 0) {
      list.appendChild(el('div', { className: 'empty', textContent: records.length ? 'No records match your search.' : 'No records yet. Add your first one on the left.' }));
    } else {
      shown.forEach(r => list.appendChild(r._id === editingId ? editCard(r) : viewCard(r)));
    }

    const n = shown.filter(r => selected.has(r._id)).length;
    const all = $('selectAll');
    all.checked = shown.length > 0 && n === shown.length;
    all.indeterminate = n > 0 && n < shown.length;
    all.disabled = shown.length === 0;

    $('selCount').textContent = selected.size + ' selected';
    $('bulkbar').className = selected.size ? 'show' : '';
  }

  function viewCard(r) {
    const box = el('input', { type: 'checkbox', checked: selected.has(r._id), ariaLabel: 'Select ' + r.title });
    box.onchange = () => { box.checked ? selected.add(r._id) : selected.delete(r._id); render(); };
    const edited = r.updatedAt !== r.createdAt ? ' (edited)' : '';
    const del = el('button', { textContent: 'Delete', className: 'danger' });
    del.onclick = () => removeOne(r, del);
    const edit = el('button', { textContent: 'Edit' });
    edit.onclick = () => { editingId = r._id; render(); };
    return el('div', { className: 'card' + (selected.has(r._id) ? ' selected' : '') }, [
      box,
      el('div', { className: 'body' }, [
        el('h3', { textContent: r.title }),
        el('div', { className: 'when', textContent: new Date(r.createdAt).toLocaleString() + edited }),
        el('p', { textContent: r.content }),
        el('div', { className: 'row' }, [edit, del])
      ])
    ]);
  }

  function editCard(r) {
    const title = el('input', { type: 'text', value: r.title, maxLength: 100 });
    const content = el('textarea', { value: r.content, maxLength: 1000 });
    const save = el('button', { textContent: 'Save changes', className: 'primary' });
    const cancel = el('button', { textContent: 'Cancel' });
    cancel.onclick = () => { editingId = null; render(); };
    save.onclick = async () => {
      if (!title.value.trim() || !content.value.trim()) return toast('Title and content are required', true);
      save.disabled = true;
      try {
        await request(API + '?id=' + r._id, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: title.value, content: content.value })
        });
        editingId = null;
        await load();
        toast('Changes saved');
      } catch (e) { toast(e.message, true); save.disabled = false; }
    };
    return el('div', { className: 'card editing' }, [
      el('label', { textContent: 'Title' }), title,
      el('label', { textContent: 'Content' }), content,
      el('div', { className: 'row' }, [save, cancel])
    ]);
  }

  async function removeOne(r, btn) {
    if (!(await ask('Delete this record?', '"' + r.title + '" will be removed permanently.', 'Delete'))) return;
    btn.disabled = true;
    try {
      await request(API + '?id=' + r._id, { method: 'DELETE' });
      selected.delete(r._id);
      await load();
      toast('Record deleted');
    } catch (e) { toast(e.message, true); btn.disabled = false; }
  }

  async function removeSelected() {
    const ids = [...selected];
    const word = ids.length === 1 ? 'record' : 'records';
    if (!(await ask('Delete ' + ids.length + ' ' + word + '?', 'This cannot be undone.', 'Delete ' + ids.length))) return;
    $('delSel').disabled = true;
    const results = await Promise.allSettled(ids.map(id => request(API + '?id=' + id, { method: 'DELETE' })));
    const failed = results.filter(x => x.status === 'rejected').length;
    $('delSel').disabled = false;
    await load();
    failed ? toast(failed + ' could not be deleted. Try again.', true) : toast(ids.length + ' ' + word + ' deleted');
  }

  $('selectAll').onchange = e => {
    visible().forEach(r => e.target.checked ? selected.add(r._id) : selected.delete(r._id));
    render();
  };
  $('clearSel').onclick = () => { selected.clear(); render(); };
  $('delSel').onclick = removeSelected;
  $('search').oninput = render;
  $('sort').onchange = render;
  $('content').oninput = e => { $('chars').textContent = e.target.value.length; };

  $('dataForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('addBtn');
    btn.disabled = true;
    try {
      await request(API, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: $('title').value, content: $('content').value })
      });
      e.target.reset();
      $('chars').textContent = '0';
      await load();
      toast('Record added');
    } catch (err) { toast(err.message, true); }
    btn.disabled = false;
  });

  load();
</script>
</body>
</html>
